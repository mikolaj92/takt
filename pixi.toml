[workspace]
name = "takt"
version = "0.3.0"
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["osx-arm64"]

[dependencies]
mojo = "==1.0.0"

[tasks]
setup-ember-json = "./tools/setup_ember_json.sh"
plant-scan = { cmd = "./tools/mojo_run.sh mojo/smoke/plant_scan.mojo", depends-on = ["setup-ember-json"] }
fusion-fallback = { cmd = "./tools/mojo_run.sh mojo/smoke/fusion_fallback.mojo", depends-on = ["setup-ember-json"] }
regulator-evaluate = { cmd = "./tools/mojo_run.sh mojo/smoke/regulator_evaluate.mojo", depends-on = ["setup-ember-json"] }
cascade-sequencer = { cmd = "./tools/mojo_run.sh mojo/smoke/cascade_sequencer.mojo", depends-on = ["setup-ember-json"] }
examples-plants = { cmd = "./tools/mojo_run.sh mojo/smoke/examples_plants.mojo", depends-on = ["setup-ember-json"] }
fala-stdio = { cmd = "./tools/mojo_run.sh mojo/smoke/fala_stdio.mojo", depends-on = ["setup-ember-json"] }
full-smoke = { cmd = "./tools/mojo_run.sh mojo/smoke/full_smoke.mojo", depends-on = ["setup-ember-json"] }
core-smoke = "pixi run plant-scan && pixi run fusion-fallback && pixi run regulator-evaluate && pixi run cascade-sequencer && pixi run examples-plants && pixi run fala-stdio && pixi run full-smoke"
