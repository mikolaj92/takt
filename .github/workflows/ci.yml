name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          run-install: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen --all-extras
      - run: pixi install --locked
      - run: pixi run core-smoke
      - run: uv run --frozen pytest
      - name: Verify public Python–Mojo binding contract
        run: |
          uv run --frozen python - <<'PY'
          import json
          from pathlib import Path
          import takt
          from takt._build import ensure_native

          ensure_native()
          for mode in ("evaluate", "run"):
              payload = Path(f"examples/fixtures/cascade_{mode}.request.json").read_text(encoding="utf-8")
              for request in (json.loads(payload), payload):
                  result = takt.cascade_step(request)
                  assert result["ok"] is True
                  if mode == "run":
                      assert result["mode"] == "run"
                      assert result["steps"] == 4
                      assert len(result["results"]) == 4
                  else:
                      assert result["outcome"] == "actuation"
                      assert result["node_id"] == "hunk:0"
                      assert "signals" in result and "events" in result
          for payload, message in (
              ("{not-json}", "Invalid identifier"),
              ("[]", "takt: request must be a JSON object"),
              ('{"mode":"unknown"}', "takt: mode must be evaluate or run"),
          ):
              try:
                  takt.cascade_step(payload)
              except Exception as error:
                  assert type(error) is Exception
                  assert str(error) == message
              else:
                  raise AssertionError(f"Mojo accepted invalid request: {payload}")
          PY
      - run: git diff --check
