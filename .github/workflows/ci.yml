name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-15
    env:
      VALIDATION_DIR: ${{ runner.temp }}/takt-validation
      UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/takt-validation/project-env
      UV_CACHE_DIR: ${{ runner.temp }}/takt-validation/uv-cache
      PYTHONPYCACHEPREFIX: ${{ runner.temp }}/takt-validation/pycache
      TMPDIR: ${{ runner.temp }}/takt-validation/tmp
    steps:
      - run: mkdir -p "$VALIDATION_DIR/tmp"
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          run-install: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen --all-extras
      - run: pixi install --locked
      - run: pixi run core-smoke
      - run: uv run --frozen pytest -o cache_dir="$VALIDATION_DIR/pytest-cache" --basetemp="$VALIDATION_DIR/pytest-tmp"
      - name: Validate source and wheel distributions
        shell: bash
        run: |
          set -euo pipefail
          uv build --sdist --out-dir "$VALIDATION_DIR/dist"
          uv run --frozen python - <<'PY'
          import os
          import tarfile
          from pathlib import Path

          validation = Path(os.environ["VALIDATION_DIR"])
          with tarfile.open(next((validation / "dist").glob("*.tar.gz"))) as archive:
              names = archive.getnames()
              root = names[0].split("/")[0]
              for resource in ("mojo/takt/sequencer.mojo", "tools/setup_ember_json.sh", "tools/lib/mojo_env.sh", "patches/emberjson-mojo-1.0.patch"):
                  assert f"{root}/{resource}" in names, resource
              archive.extractall(validation / "sdist", filter="data")
          PY
          uv build --wheel "$VALIDATION_DIR"/sdist/* --out-dir "$VALIDATION_DIR/dist"
          uv run --frozen python - <<'PY'
          import os
          import zipfile
          from pathlib import Path
          from takt._build import repo_root

          assert repo_root() == Path.cwd()
          os.environ["TAKT_HOME"] = str(Path(os.environ["VALIDATION_DIR"]) / "explicit-root")
          assert repo_root() == Path(os.environ["TAKT_HOME"]).resolve()
          with zipfile.ZipFile(next((Path(os.environ["VALIDATION_DIR"]) / "dist").glob("*.whl"))) as archive:
              names = archive.namelist()
              assert not any(name.startswith(("mojo/", "tools/", "patches/")) for name in names)
              for resource in ("mojo/takt/sequencer.mojo", "tools/setup_ember_json.sh", "tools/lib/mojo_env.sh", "patches/emberjson-mojo-1.0.patch"):
                  assert f"takt/{resource}" in names, resource
          PY
          uv venv "$VALIDATION_DIR/wheel-env" --python 3.12
          uv pip install --python "$VALIDATION_DIR/wheel-env/bin/python" "$VALIDATION_DIR"/dist/*.whl
          export TAKT_VALIDATION_CHECKOUT="$PWD"
          pixi run -- bash -c '
          cd "$VALIDATION_DIR"
          env -u PYTHONPATH -u TAKT_HOME "$VALIDATION_DIR/wheel-env/bin/python" - <<'\''PY'\''
          import json
          import os
          from pathlib import Path
          import takt
          from takt._build import repo_root

          package = Path(takt.__file__).resolve().parent
          assert package.is_relative_to(Path(os.environ["VALIDATION_DIR"]) / "wheel-env")
          assert repo_root() == package
          assert not (package / "vendor" / "EmberJson").exists()
          request = Path(os.environ["TAKT_VALIDATION_CHECKOUT"]) / "examples/fixtures/cascade_evaluate.request.json"
          result = takt.cascade_step(json.loads(request.read_text()))
          assert result["ok"] is True, result
          assert result["outcome"] == "actuation", result
          assert result["node_id"] == "hunk:0", result
          assert (package / "vendor/EmberJson/emberjson/__init__.mojo").is_file()
          assert list((package / "__mojocache__").glob("_native.hash-*.so"))
          print(json.dumps(result))
          PY
          '
      - run: git diff --check
