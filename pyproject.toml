[project]
name = "takt"
version = "0.3.0"
description = "Generic hierarchical cascade (Mojo) + thin optional Python binding."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "mikolaj92" }]
dependencies = []
keywords = ["cascade", "homeostat", "cybernetics", "mojo", "regulation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/mikolaj92/takt"
Repository = "https://github.com/mikolaj92/takt"
Issues = "https://github.com/mikolaj92/takt/issues"
Changelog = "https://github.com/mikolaj92/takt/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/takt"]
force-include = { "mojo" = "mojo", "tools" = "tools", "patches" = "patches" }

[tool.hatch.build.targets.sdist]
include = [
  "python/takt",
  "mojo",
  "tools",
  "patches",
  "examples",
  "docs",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "pixi.toml",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]
